# Example for the inspected 47.95.251.153 IP site on 2026-10-28.
# Review `nginx -T` before use; preserve every existing site route when adapting.
# The private key itself must stay on the server, outside Git.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 47.95.251.153;

    ssl_certificate /etc/letsencrypt/live/47.95.251.153/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.95.251.153/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IP_SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/zhongchuliang;
    index index.html;
    include /etc/nginx/snippets/acme-ip.conf;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    include /etc/nginx/snippets/grain-inspection-newProject.conf;
    include /etc/nginx/snippets/three-chess.conf;
}
