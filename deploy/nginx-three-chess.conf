location = /three-chess {
    return 301 /three-chess/;
}

location ^~ /three-chess/socket.io/ {
    proxy_pass http://127.0.0.1:3000/three-chess/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 65s;
    proxy_buffering off;
}

location ^~ /three-chess/api/ {
    proxy_pass http://127.0.0.1:3000/three-chess/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /three-chess/assets/ {
    root /;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /three-chess/ {
    root /;
    index index.html;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /three-chess/index.html;
}
